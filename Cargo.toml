[package]
name = "bevy_sdl_gamepad"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
bevy_app = { version = "0.20.0", default-features = false }
bevy_ecs = { version = "0.20.0", default-features = false }
bevy_input = { version = "0.20.0", default-features = false, features = ["gamepad", "touch"] }
bevy_log = { version = "0.20.0" }
bevy_math = { version = "0.20.0", default-features = false, features = ["std"] }
bevy_platform = { version = "0.20.0", default-features = false }
bevy_time = { version = "0.20.0", default-features = false }
sdl3-sys = { version = "0.7.2", default-features = false, features = [
  "use-pkg-config",
  "debug-impls",
  "no-default-subsystems",
  "sdl-joystick",
  "sdl-hidapi",
  "sdl-haptic",
  "sdl-sensor",
  "sdl-power",
  "sdl-unix-console-build",
] }

[features]
default = ["build-sdl"]
# Build SDL from source and link it statically, which needs CMake and a C compiler. Without this
# feature, the SDL 3 library installed on the system is found with pkg-config and linked.
build-sdl = ["sdl3-sys/build-from-source-static"]

[dev-dependencies]
# Only what the example needs, plus `bevy_gilrs` so that it disables GilrsPlugin as most apps must.
bevy = { version = "0.20.0", default-features = false, features = [
  "bevy_gilrs",
  "std",
  "multi_threaded",
  "bevy_log",
  "bevy_winit",
  "x11",
  "wayland",
  "gamepad",
  "ui_bevy_render",
  "bevy_feathers",
  "custom_cursor",
  "bevy_scene",
] }
